org.gradle.jvmargs=-Xmx4G
# CI's gradle/actions/setup-gradle persists Gradle's build-cache directory (task outputs, not just
# downloaded dependencies) across runs, but Gradle only reads/writes it when caching is actually
# enabled -- without this, that persisted cache sits unused and every task (Kotlin compile,
# dexing, resource merge, per ABI) reruns from scratch even when its inputs haven't changed since
# the last run. Also speeds up local builds across `flutter build`/`flutter run` invocations for
# the same reason.
org.gradle.caching=true
android.useAndroidX=true
# Disabled 2026-07-24: Jetifier rewrites legacy Android Support Library artifacts to AndroidX at
# build time. Every dependency in this project's graph has been AndroidX-native for a while now
# (see UPGRADE_PLAN.md's Phase 1/2/3 dependency bumps) -- verified by actually building, installing,
# and launching with it off rather than assumed. Was left on, unexamined, since the 2021 original.
android.enableJetifier=false
# Migrated to Flutter's built-in Kotlin support 2026-08-16 (Flutter 3.47.0 stable): the app no
# longer applies the Kotlin Gradle Plugin itself (see android/app/build.gradle), and
# flutter_tools/gradle's FlutterPluginUtils now gates its force-applied kotlin-android plugin
# behind this flag instead of applying it unconditionally like it did on 3.44.x. See TODO.md.
android.builtInKotlin=true
android.newDsl=false
