name: CI

on:
  # Prose does not compile. A change that only touches documentation cannot break a build, so it
  # does not get one. `**.md` covers the prose wherever it lives, including the files kept in the
  # root (README, AGENTS, CLAUDE); `docs/**` is what catches the non-markdown documentation
  # assets, such as the README screenshot. The list is repeated because GitHub Actions does not
  # read YAML anchors. Note that none of these checks is a required status check -- if one ever
  # becomes required, a skipped run never reports and a docs-only PR would block on it forever.
  pull_request:
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - "docs/**"
  # A merge is just a push to main under the hood (merge commit, squash, or rebase all land as a
  # new commit on main), so this also fires on every PR merge. Needed because GitHub Actions'
  # cache (and Gradle's enhanced cache) only writes to the default-branch scope on runs where
  # `ref` is actually `refs/heads/main` -- pull_request runs never satisfy that, so without this,
  # every new PR branch would restore nothing and start cold regardless of how many prior PRs had
  # already warmed the cache.
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - "docs/**"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Read pinned Flutter version
        id: flutter_version
        run: |
          version=$(python3 -c "import json; print(json.load(open('.fvmrc'))['flutter'])")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.flutter_version.outputs.version }}
          channel: stable
          cache: true

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      # Caches Gradle User Home (downloaded dependencies, wrapper distribution, compiled build
      # scripts, local build cache) across runs, so a PR with unchanged dependencies doesn't
      # re-download AGP/Kotlin/every Maven artifact and re-resolve them from scratch on every
      # push -- that's most of what makes "Build debug APK" below the slowest step by far. Applies
      # to any Gradle invocation on the runner regardless of working directory, so it covers
      # `flutter build apk`'s `android/gradlew` call with no extra config. Defaults (the free,
      # public-repo "enhanced" cache provider; automatic stale-entry cleanup) are already what we
      # want here.
      - uses: gradle/actions/setup-gradle@v6

      - run: flutter pub get

      - name: Format check
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Test
        run: flutter test

      - name: Build debug APK
        run: flutter build apk --debug